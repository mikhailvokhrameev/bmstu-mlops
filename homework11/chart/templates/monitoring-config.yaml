{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
      - job_name: inference
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [{{ .Release.Namespace }}]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            regex: {{ .Release.Name }}
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: api
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
      - job_name: kube-state-metrics
        static_configs:
          - targets: ['{{ .Release.Name }}-kube-state-metrics:8080']
      - job_name: cadvisor
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs: [{role: node}]
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
  alerts.yml: |
    groups:
      - name: inference
        rules:
          - alert: InferenceHighTTFC
            expr: histogram_quantile(0.95, sum by (le) (rate(simulated_ttfc_seconds_bucket[1m]))) > 1.5 and sum(increase(simulated_ttfc_seconds_count[1m])) >= 20
            for: 30s
            labels: {severity: warning}
            annotations:
              summary: Successful response TTFC p95 exceeds 1.5 seconds (20+ completions/minute)
          - alert: InferenceRefusalRate
            expr: sum(rate(simulated_requests_total{outcome=~"rejected|queue_timeout|unready|aborted"}[1m])) / sum(rate(simulated_requests_total[1m])) > 0.1 and sum(increase(simulated_requests_total[1m])) >= 20
            for: 30s
            labels: {severity: warning}
            annotations:
              summary: Refusals and aborted streams exceed 10 percent (20+ terminal attempts/minute)
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ .Release.Name }}-prometheus:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: homework11
        options: {path: /var/lib/grafana/dashboards}
  dashboard.json: |
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
{{- end }}
