# Пайплайн ДЗ 3: fetch → collect → clean → diversity → split.
#
# Два правила, из-за нарушения которых пайплайн «не пересчитывается»:
#   deps — всё, от чего зависит результат: входные данные И код стадии;
#   params — секции params.yaml, при изменении которых стадия обязана
#            переисполниться (пути к источникам живут там, а не в deps).
# Стадия обязана перечислить каждый ключ params.yaml, который читает: версия
# датасета переключается параметром, и если её нет в params, смена версии
# для dvc — не событие. Стадия fetch ходит в сеть, поэтому её deps и params
# трогать нельзя без нужды: любая правка перезапускает сбор снимка.
# Пути в outs дублируют paths.* из params.yaml: dvc.yaml не умеет читать
# params, поэтому согласованность проверяется в tests/check.sh.

stages:
  fetch:
    cmd: python -m src.fetch
    deps:
      - src/fetch.py
      - src/config.py
    params:
      - fetch
      - paths.source_dir
      - paths.metrics_fetch
    outs:
      - data/source
    metrics:
      - metrics/fetch.json:
          cache: false

  collect:
    cmd: python -m src.collect
    deps:
      - data/source
      - src/collect.py
      - src/config.py
    params:
      - collect
      - paths.raw
      - paths.metrics_collect
    outs:
      - data/raw.jsonl
    metrics:
      - metrics/collect.json:
          cache: false

  clean:
    cmd: python -m src.clean
    deps:
      - data/raw.jsonl
      - src/clean.py
      - src/dedup.py
      - src/pii.py
      - src/schema.py
      - src/stats.py
      - src/textnorm.py
      - src/config.py
    params:
      - clean
      - collect.version
      - paths.raw
      - paths.clean
      - paths.metrics_clean
    outs:
      - data/clean.jsonl
    metrics:
      - metrics/clean.json:
          cache: false

  diversity:
    cmd: python -m src.diversity
    deps:
      - data/clean.jsonl
      - src/diversity.py
      - src/stats.py
      - src/schema.py
      - src/textnorm.py
      - src/config.py
    params:
      - diversity
      - split.group_key
      - collect.version
      - paths.clean
      - paths.metrics_diversity
    metrics:
      - metrics/diversity.json:
          cache: false

  split:
    cmd: python -m src.split
    deps:
      - data/clean.jsonl
      # Гейт разнообразия стоит перед сплитом: провалился он — теста не будет.
      - metrics/diversity.json
      - src/split.py
      - src/contamination.py
      - src/dedup.py
      - src/schema.py
      - src/textnorm.py
      - src/config.py
    params:
      - split
      - contamination
      - clean.near_dup
      - collect.version
      - paths.clean
      - paths.train
      - paths.val
      - paths.test
      - paths.metrics_split
    outs:
      - data/train.jsonl
      - data/val.jsonl
      - data/test.jsonl
    metrics:
      - metrics/split.json:
          cache: false

  tokenize:
    cmd: python -m src.tokenize_data
    deps:
      - data/train.jsonl
      - data/val.jsonl
      - src/tokenize_data.py
      - src/prompt.py
      - src/collate.py
      - src/pack.py
      - src/config.py
    params:
      - model
      - tokenize
      - packing
      - train_estimate
      - data.train_jsonl
      - data.val_jsonl
      - data.out_dir
    outs:
      - data/tokenized
    metrics:
      - metrics/tokenize.json:
          cache: false

  # --- ДЗ 5 ---
  train_all:
    cmd: python -m src.train --variant all_layers
    deps:
      - data/tokenized/train.pt
      - data/tokenized/val.pt
      - src/train.py
      - src/data.py
      - src/runtime.py
      - src/config.py
    params:
      - model
      - lora_train
      - train
      - variants
    outs:
      - models/adapter_all_layers
    metrics:
      - metrics/train_all_layers.json:
          cache: false

  train_freeze:
    cmd: python -m src.train --variant freeze14
    deps:
      - data/tokenized/train.pt
      - data/tokenized/val.pt
      - src/train.py
      - src/data.py
      - src/runtime.py
      - src/config.py
    params:
      - model
      - lora_train
      - train
      - variants
    outs:
      - models/adapter_freeze14
    metrics:
      - metrics/train_freeze14.json:
          cache: false

  compare:
    cmd: python -m src.compare --variant all_layers
    deps:
      - models/adapter_all_layers
      - src/compare.py
    params:
      - compare
    outs:
      - docs/compare.md:
          cache: false
    metrics:
      - metrics/compare_all_layers.json:
          cache: false
