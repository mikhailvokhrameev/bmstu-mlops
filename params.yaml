# Единственное место, где живёт конфигурация. В src/ констант нет.
model:
  name: "Qwen/Qwen3-0.6B"
  dtype: "bfloat16"
  device: "auto"            # auto | cpu | cuda | mps
  # Qwen3 без этого флага ждёт от модели <think>-блок, и тогда шаблон
  # инференса перестаёт быть префиксом шаблона обучения. См. docs/tokenize_report.md.
  enable_thinking: false

generate:
  max_new_tokens: 200
  temperature: 0.0          # 0 — жадный поиск, детерминированно
  seed: 42
  enable_thinking: false    # Qwen3 без этого отвечает <think>-блоком

bench:
  warmup_runs: 1            # прогрев не засчитывается в замер
  measure_runs: 3
  prompt: "Объясни, что такое MLOps, в трёх предложениях."

hooks:
  prompt: "Объясни, что такое MLOps, в трёх предложениях."
  plot: "docs/activations.png"

memory:
  seq_len: 256
  batch_size: 1
  lr: 1.0e-5
  repeats: 1

lora:
  alpha_ratio: 2            # lora_alpha = alpha_ratio * r
  dropout: 0.0
  configs:
    - name: "r=8, q_proj+v_proj"
      r: 8
      target_modules: ["q_proj", "v_proj"]
    - name: "r=16, все линейные"
      r: 16
      target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                       "gate_proj", "up_proj", "down_proj"]

report:
  json: "docs/report.json"
  markdown: "docs/anatomy.md"

# --- ДЗ 3: датасет, DVC, валидация схемы, честный сплит ---
# Ни один путь, порог или размер среза не должен появляться в коде строкой.

fetch:
  # Источник — Stack Overflow, вопросы по MLOps-инструментам с принятым ответом.
  # Снимок собирается ОДИН раз (лимит API — 300 запросов в сутки на IP),
  # дальше стадии работают с ним из кэша DVC.
  site: "stackoverflow"
  api: "https://api.stackexchange.com/2.3"
  # Кастомный фильтр API: только нужные поля, включая body_markdown и content_license.
  filter: "!FyN2A_UsTcy)9peuviF7IGMkUGExv7c2gPkis-"
  pool: 100                  # вопросов с принятым ответом на тег, топ по голосам
  per_shard: 40              # вопросов на тег в одном шарде
  shards: 2                  # шард 0 — v1, шарды 0 и 1 — v2
  pause_seconds: 0.5         # пауза между запросами; backoff API важнее
  # Порядок значим: вопрос с несколькими тегами достаётся первому из них.
  # Поэтому редкие теги идут первыми, а airflow — почти последним.
  tags:
    - neptune
    - deepspeed
    - flyte
    - ludwig
    - tensorflow-model-analysis
    - tensorflow-extended
    - feast
    - label-studio
    - tvm
    - seldon
    - netflix-metaflow
    - mleap
    - tensorboardx
    - triton
    - torchserve
    - horovod
    - feature-store
    - clearml
    - ray-tune
    - azure-ml-pipelines
    - huggingface-hub
    - mlrun
    - hyperopt
    - wandb
    - amazon-sagemaker-studio
    - great-expectations
    - dvc
    - dagster
    - tekton
    - tfx
    - optuna
    - knative
    - prefect
    - kedro
    - gcp-ai-platform-notebook
    - google-ai-platform
    - mlops
    - nvidia-docker
    - kubeflow-pipelines
    - argo-workflows
    - luigi
    - onnxruntime
    - tensorrt
    - openvino
    - kubeflow
    - argocd
    - ray
    - mlflow
    - onnx
    - minio
    - google-cloud-vertex-ai
    - tensorflow-serving
    - tensorboard
    - google-cloud-composer
    - azure-machine-learning-service
    - amazon-sagemaker
    - airflow

collect:
  # Версия датасета переключается ЗДЕСЬ. Всё остальное — следствие.
  version: "v2"              # v1 | v2
  n_rows: 3000               # строк, берём из каждого файла-источника ПОСЛЕ фильтров
  sources:
    v1:
      - "data/source/stackoverflow_0000.jsonl"
    v2:
      - "data/source/stackoverflow_0000.jsonl"
      - "data/source/stackoverflow_0001.jsonl"

  # --- Переработка источника ---
  # Чужой готовый набор — это сырьё, а не сдача. Параметры ниже — то, чем
  # raw.jsonl отличается от «выгрузил из API и переименовал». Каждый из них
  # отражён в metrics/collect.json и в docs/datasheet.md.

  topics: null               # null — все теги; список тегов сужает набор.
                             # Следите за diversity.min_groups: один тег не датасет.

  verify_answer: true        # сверять принятый ответ с разметкой источника:
                             # ответ отмечен принятым и относится именно к этому
                             # вопросу. Расхождение — строка выбрасывается
                             # и попадает в счётчик.
  min_question_score: 1      # вопрос без голосов — не вопрос, а шум
  min_answer_score: 1        # ответ, принятый автором, но не поддержанный никем,
                             # в обучение не берём
  max_answer_chars: 3000     # слишком длинные ответы — простыни логов и дампов

  system_prompts:            # В источнике инструкции нет вовсе, а модель, обученная
                             # на одной формулировке, заучивает её как константу.
                             # Поэтому инструкция разведена на варианты; вариант
                             # выбирается детерминированно по id примера.
    - "Ты инженер по MLOps и отвечаешь на технические вопросы со Stack Overflow. Дан вопрос по инструменту или платформе. Дай точный практичный ответ, при необходимости с командой или фрагментом кода."
    - "Перед тобой вопрос разработчика по MLOps-инструментам: трекинг экспериментов, оркестрация, деплой моделей, версионирование данных. Ответь по существу, с примером конфигурации или кода, если он нужен."
    - "Задача: ответить на вопрос со Stack Overflow про эксплуатацию моделей машинного обучения. Назови причину проблемы и способ её решения, код и команды приводи в блоках."
    - "Ты помогаешь коллеге, который застрял при настройке MLOps-инструмента. Прочитай вопрос и дай решение, которое принято сообществом: коротко объясни причину и покажи, что изменить."
    - "Отвечай на технические вопросы по MLOps так, как это делает опытный участник Stack Overflow: сначала суть решения, затем пример команды, конфига или кода. Не выдумывай несуществующих опций."

clean:
  # Фильтр длин: слишком короткий пример — обрезок, слишком длинный — выброс.
  min_user_chars: 30
  max_user_chars: 4000
  min_assistant_chars: 2
  near_dup:
    enabled: true
    shingle_words: 4         # длина словного шингла
    num_perm: 64             # перестановок MinHash: точность против скорости
    threshold: 0.85          # Жаккар выше порога — почти-дубль
  pii:
    enabled: true            # стадия обязательна, даже если счётчик нулевой

diversity:
  # Пороги, которым обязан удовлетворять ОЧИЩЕННЫЙ датасет. Стадия diversity
  # падает, если нарушен хоть один: набор из 30 однотипных строк проходит
  # и схему, и дедупликацию, и сплит — формально он безупречен и бесполезен.
  # Разбор такого случая: один системный промпт на все строки, ответы длиной
  # 356–440 символов, сквозные слова во всех ответах. Лосс на нём падает,
  # а модель выучивает шаблон вместо задачи.
  #
  # Пороги — не догма: их можно менять под свою задачу, но только в эту сторону
  # и только с обоснованием в docs/datasheet.md. «Снизил, чтобы позеленело» —
  # не обоснование.

  min_examples: 1000         # строк после очистки. Меньше — модель увидит
                             # каждый пример по нескольку раз за эпоху.
  min_system_prompts: 3      # различных системных промптов
  min_groups: 50             # различных групп (split.group_key)
  max_group_share: 0.10      # доля крупнейшей группы: одна тема не должна
                             # решать за весь датасет
  min_answer_len_ratio: 1.6  # p90/p10 длин ответа ассистента. Ответы одной
                             # длины — верный признак сгенерированного шаблона.
                             # Если у вашей задачи ответы законно однотипные
                             # (метки классов, да/нет) — снижайте порог и
                             # покажите разнообразие на другой оси в datasheet.
  max_same_length_share: 0.25   # доля примеров с самой частой длиной ответа
  max_duplicate_answer_share: 0.30  # доля ответов-повторов (точные совпадения)

split:
  # Группа сплита. Вопросы одного тега не должны разъезжаться по train/test:
  # тег дословно входит в промпт, а вопросы внутри тега — про один и тот же
  # инструмент и часто про одну и ту же ошибку.
  group_key: "topic"
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  seed: 42

contamination:
  # Порог поиска near-dup пересечений train/test.
  # Обязан совпадать с clean.near_dup.threshold. Более строгий порог здесь
  # ловил бы не контаминацию, а разницу порогов: пары с Жаккаром между
  # порогом чистки и порогом проверки очистку проходят законно.
  threshold: 0.85

paths:
  source_dir: "data/source"
  raw: "data/raw.jsonl"
  clean: "data/clean.jsonl"
  train: "data/train.jsonl"
  val: "data/val.jsonl"
  test: "data/test.jsonl"
  metrics_fetch: "metrics/fetch.json"
  metrics_collect: "metrics/collect.json"
  metrics_clean: "metrics/clean.json"
  metrics_split: "metrics/split.json"
  metrics_diversity: "metrics/diversity.json"

# --- ДЗ 4: препроцессинг — chat template, masking, packing ---

data:
  # Датасет курса (CC-BY-4.0), лежит вне проекта — под DVC, не в git.
  source_train: "../../datasets/nmo/sft_single/train/0000.parquet"
  source_val: "../../datasets/nmo/sft_single/validation/0000.parquet"
  train_jsonl: "data/train.jsonl"
  val_jsonl: "data/val.jsonl"
  out_dir: "data/tokenized"

sample:
  train_size: 500
  val_size: 100
  scan_rows: 20000          # сколько строк parquet просматриваем перед выборкой
  seed: 42

tokenize:
  max_seq_len: 1536
  truncated_warn_ratio: 0.05
  padding_side: "left"

packing:
  enabled: true
  batch_size: 8             # для пересчёта выигрыша в шагах оптимизатора

train_estimate:
  epochs: 3
  # 52 ток/с — замер ДЗ 1 на этой машине (Apple Silicon, Qwen3-0.6B, ГЕНЕРАЦИЯ).
  # Обучение медленнее: forward + backward + optimizer. Реальное число
  # подставляется сюда после первого прогона ДЗ 5.
  tokens_per_sec: 52
